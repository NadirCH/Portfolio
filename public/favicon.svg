<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="glow" cx="62%" cy="56%" r="48%">
      <stop offset="0%" stop-color="#EC4067" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#EC4067" stop-opacity="0" />
    </radialGradient>
    <filter id="dot-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Matte Dark Squircle Background -->
  <rect width="512" height="512" rx="114" fill="#0D0D0F" stroke="rgba(255, 255, 255, 0.1)" stroke-width="12" />

  <!-- Subtle Accent Ambient Lighting -->
  <circle cx="295" cy="270" r="180" fill="url(#glow)" />

  <!-- Monogram Brand Typography: NCH -->
  <text x="218" y="322" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-size="168" 
        font-weight="900" 
        letter-spacing="-0.04em" 
        fill="#FFFFFF" 
        text-anchor="middle">NCH</text>

  <!-- Brand Accent Dot (#EC4067) -->
  <circle cx="400" cy="308" r="20" fill="#EC4067" filter="url(#dot-glow)" />
</svg>
